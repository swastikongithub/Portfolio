      name="description"
      content="Swastik Singh builds backends for the second time something happens: LPU Reserve, VulnTrack, Tenora and an AI Interview Platform, each built around one guarantee the database enforces."
    />

    <meta property="og:type" content="website" />

    <meta name="theme-color" content="#e4e6e9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f12" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script>
      // Resolve the theme before first paint so there is no flash of the wrong palette.
      (function () {
        var d = document.documentElement;
        d.classList.add('js');
        var theme = null;
        try { theme = localStorage.getItem('portfolio-theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme === 'dark') d.classList.add('dark');
        d.style.colorScheme = theme;
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Martian+Mono:wdth,wght@75..112.5,300..700&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Static first frame: complete without JavaScript, replaced when the app mounts. */
      .boot { min-height: 100svh; box-sizing: border-box; padding: 96px clamp(16px, 3.2vw, 48px) 48px;
        display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
        background: #e4e6e9; color: #0e1115; font-family: 'Schibsted Grotesk', system-ui, sans-serif; }
      .dark .boot { background: #0d0f12; color: #e7e9ec; }
      .boot small { font-size: 1rem; }
      .boot h1 { margin: 12px 0 0; font-size: clamp(3.4rem, 10.4vw, 11.5rem); line-height: .88; font-weight: 800; letter-spacing: -.045em; }
      .boot p { max-width: 40ch; font-size: 1.2rem; line-height: 1.45; margin: 0 0 18px; }
      .boot a { color: inherit; margin-right: 18px; }
      .js .boot { visibility: hidden; animation: boot-reveal 0s 3s forwards; }
      @keyframes boot-reveal { to { visibility: visible; } }
    </style>
  </head>

          </p>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
